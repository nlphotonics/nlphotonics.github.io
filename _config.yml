title: Nonlinear Photonics
first_name: Haiwei
middle_name: null
last_name: Wang
description: |
  A simple, whitespace theme for academics. Based on [*folio](https://github.com/bogoli/-folio) design.
footer_text: |
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme. Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
lang: en
icon: 📖
url: https://nlphotonics.github.io
baseurl: null
last_updated: true
navbar_fixed: true
footer_fixed: false
max_width: 800px
blog_name: blog
blog_description: some short passages
permalink: /blog/:year/:title/
related_blog_posts:
  enabled: false
  max_related: 5
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
scholar:
  last_name:
  - Einstein
  first_name:
  - Albert
  - A.
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters:
  - latex
  - smallcaps
  - superscript
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: '@*'
enable_math: true
enable_darkmode: true
enable_project_categories: true
enable_medium_zoom: true
enable_progressbar: false
theme: al_folio_core
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false
back_to_top: false
search_enabled: false
pagination:
  enabled: true
collections:
  projects:
    output: true
    permalink: /projects/:path/
jekyll-archives:
  posts:
    enabled:
    - year
    layout: archive
    permalinks:
      year: /blog/:year/
include:
- _pages
exclude:
- bin
- Gemfile
- Gemfile.lock
- vendor
- al-folio-upgrade-report.md
# Optional theme assets used only by features this site does not enable.
- assets/tailwind
- assets/al_img_tools/css/lightbox2-adapter.css
- assets/al_img_tools/js/lightbox2-adapter.js
- assets/al_img_tools/js/venobox-setup.js
- assets/al_math/js/pseudocode-setup.js
- assets/css/jupyter.css
- assets/css/jupyter-grade3.css
- assets/css/jupyter-monokai.css
- assets/js/bibsearch.js
- assets/js/calendar-setup.js
- assets/js/highlight-search-term.js
- assets/js/masonry.js
- assets/js/progress-bar.js
- assets/js/table-engine.js
- assets/js/tabs.js
- assets/js/typograms.js
sass:
  style: compressed
  sourcemap: never
imagemagick:
  enabled: false
lazy_loading_images: true
third_party_libraries:
  download: false
  google_fonts:
    url:
      fonts: https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap
  fontawesome:
    integrity:
      css: sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c=
    url:
      css: https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{{version}}/css/all.min.css
    version: 7.2.0
  academicons:
    integrity:
      css: sha256-SzrCOBJbGVFMahewkgjwnApaV2+av1DwMAA+/QGLyZw=
    url:
      css: https://cdn.jsdelivr.net/npm/academicons@{{version}}/css/academicons.min.css
    version: 1.9.5
  mathjax:
    integrity:
      js: sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI=
    local:
      fonts: output/chtml/fonts/woff-v2/
    url:
      fonts: https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/output/chtml/fonts/woff-v2/
      js: https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/tex-mml-chtml.js
    version: 3.2.2
plugins:
- jekyll-3rd-party-libraries
- jekyll-archives-v2
- jekyll-cache-bust
- jekyll-paginate-v2
- jekyll/scholar
- jekyll-socials
- jekyll-toc
- al_folio_core
- al_folio_upgrade
- al_icons
- al_img_tools
- al_math
